name: MSIX package

# Builds the Microsoft Store package to prove it stays buildable. It is NOT published anywhere:
# the Store submission is done by hand in Partner Center (see packaging/msix/README.md).
on:
  workflow_dispatch:
  push:
    paths: ['packaging/msix/**', 'src/**', '.github/workflows/msix.yml']
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    # Informational: does a registry change made inside the installed package reach Windows on a standard build?
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]   # windows-2022 cannot install MSIX packages (0x80131539)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build test-signed package
        shell: pwsh
        run: >
          ./packaging/msix/build-msix.ps1 -SignTest -Out dist-msix-test
          -Name 'BBTraining.PulseCheck'
          -Publisher 'CN=221E9C12-EEA4-4A59-923A-78D9F1320A4A'
          -PublisherDisplayName 'BB Training'
      - name: Trust the test certificate and install
        shell: pwsh
        run: |
          Import-Certificate -FilePath dist-msix-test/test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage -Path (Resolve-Path dist-msix-test/PulseCheck.msix)
          Get-AppxPackage BBTraining.PulseCheck | Select-Object Name, Version, PackageFamilyName | Format-List
      - name: Probe registry virtualization
        shell: pwsh
        run: ./packaging/msix/probe-virtualization.ps1

  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build package
        shell: pwsh
        # Identity values come from Partner Center > PulseCheck > Product identity (public, not secrets).
        run: >
          ./packaging/msix/build-msix.ps1
          -Name 'BBTraining.PulseCheck'
          -Publisher 'CN=221E9C12-EEA4-4A59-923A-78D9F1320A4A'
          -PublisherDisplayName 'BB Training'

      # Same package, signed with a throw-away certificate (private key deleted) so it can be installed
      # locally for testing. It is NOT what gets submitted to the Store.
      - name: Build test-signed copy
        shell: pwsh
        run: >
          ./packaging/msix/build-msix.ps1 -SignTest -Out dist-msix-test
          -Name 'BBTraining.PulseCheck'
          -Publisher 'CN=221E9C12-EEA4-4A59-923A-78D9F1320A4A'
          -PublisherDisplayName 'BB Training'

      - name: Check the package
        shell: pwsh
        run: |
          $f = Get-Item dist-msix/PulseCheck.msix
          "Package size: {0:N1} MB" -f ($f.Length / 1MB)
          if ($f.Length -lt 10MB) { throw 'package unexpectedly small' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead($f.FullName)
          $names = $z.Entries.FullName
          $z.Dispose()
          foreach ($need in 'AppxManifest.xml', 'PulseCheck.exe', 'Assets/StoreLogo.png', 'Assets/Square150x150Logo.png') {
            if ($names -notcontains $need) { throw "missing $need in package" }
          }
          'Package content OK'

      - uses: actions/upload-artifact@v4
        with:
          name: PulseCheck-store-msix
          path: dist-msix/PulseCheck.msix
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: PulseCheck-test-signed
          path: |
            dist-msix-test/PulseCheck.msix
            dist-msix-test/test.cer
          retention-days: 2
