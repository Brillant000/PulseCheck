name: Release

# Push a tag such as v1.1.0 to build and publish a release.
# The executable is built here from the public source, hashed, and given a signed
# build-provenance attestation that anyone can verify with:
#   gh attestation verify PulseCheck.exe --repo <owner>/<repo>
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test PulseCheck.sln -c Release

      - name: Publish single-file executable
        run: >
          dotnet publish src/PulseCheck.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o dist

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/PulseCheck.exe -Algorithm SHA256).Hash.ToLower()
          "$h  PulseCheck.exe" | Out-File -Encoding ascii dist/PulseCheck.exe.sha256
          "HASH=$h" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/PulseCheck.exe

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @"
          **PulseCheck ${{ github.ref_name }}** - free PC and network health check, built for brand-new computers.

          Download ``PulseCheck.exe`` and double-click it (Windows 10/11, 64-bit, .NET bundled).
          Windows SmartScreen may warn because the file is not code-signed yet: *More info > Run anyway*.

          **Verify your download**

          SHA-256: ``$env:HASH``

          ``````powershell
          Get-FileHash .\PulseCheck.exe -Algorithm SHA256
          gh attestation verify .\PulseCheck.exe --repo ${{ github.repository }}
          ``````

          The attestation proves this file was built by GitHub Actions from this repository at tag ``${{ github.ref_name }}``.
          "@
          gh release create "${{ github.ref_name }}" dist/PulseCheck.exe dist/PulseCheck.exe.sha256 `
            --title "PulseCheck ${{ github.ref_name }}" --notes $notes
